[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-make-publishing-insights"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
test = ["jsonschema[format]>=4.23,<5", "PyYAML>=6,<7"]

[tool.ruff.lint.per-file-ignores]
# Direct invocation with -I deliberately adds this standalone service to sys.path.
"tests/test_publishing.py" = ["E402"]

[tool.setuptools.packages.find]
include = ["publishing*"]
